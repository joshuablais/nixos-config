# ─── Prefix ────────────────────────────────────────────────────────────
unbind C-Space
set -g prefix C-b
# C-b C-b: backward-char in copy mode, literal C-b to readline/Emacs elsewhere
bind C-b if -F '#{pane_in_mode}' 'send -X cursor-left' 'send-prefix'

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ─── Layout ────────────────────────────────────────────────────────────
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1
set -g repeat-time 600          # window for repeated prefix <arrow> / C-<arrow> / M-<arrow>

# Pane navigation and resizing: tmux defaults, all under the prefix.
#   prefix <arrow>     select pane
#   prefix C-<arrow>   resize by 1
#   prefix M-<arrow>   resize by 5

bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind b break-pane -d

# ─── Emacs keys ────────────────────────────────────────────────────────
# Explicit: tmux silently picks vi if $EDITOR/$VISUAL contains "vi"
set -g mode-keys emacs
set -g status-keys emacs

bind v copy-mode
bind C-y paste-buffer -p        # bracketed paste

# M-w / C-w / mouse drag → copy-pipe-and-cancel → copy-command
set -s copy-command 'wl-copy'    # X11: 'xclip -selection clipboard -i'
set -s set-clipboard on          # OSC 52 as well, survives SSH

# ─── Terminal ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
# Pass C-; C-. C-, C-<return> C-M-% etc. through to Emacs
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# ─── Plugins ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @plugin 'noscript/tmux-mighty-scroll'
set -g mouse on
set -g @mighty-scroll-interval 3
set -g @mighty-scroll-by-line 'man fzf'
set -g @mighty-scroll-select-pane off

run '~/.tmux/plugins/tpm/tpm'
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux